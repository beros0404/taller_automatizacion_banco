webdriver {
  driver = chrome
  autodownload = true
  wait.for.timeout = 15000

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

headless.mode = false

serenity {
  project.name = "Banco XYZ - Proyecto 9 - Screenplay"
  take.screenshots = FOR_EACH_ACTION
  use.unique.browser = true
}

chrome.switches = "--start-maximized;--no-sandbox;--disable-dev-shm-usage;--remote-allow-origins=*;--disable-notifications"
